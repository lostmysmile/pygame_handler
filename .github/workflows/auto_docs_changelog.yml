name: Auto Update Docs & Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository with full commit history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Dynamically generate markdown docs from python docstrings
      - name: Auto-generate Documentation
        run: |
          pip install pydoc-markdown
          mkdir -p docs
          # Inspects your custom handler library modules and builds clean Markdown
          pydoc-markdown -m src.system.main > docs/API.md
          
      # 4. Generate the changelog update based on your commits
      - name: Auto-generate Changelog
        uses: triaxtec/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: 'CHANGELOG.md'

      # 5. Commit and push any changes back to main branch safely
      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update documentation and changelog [skip ci]"
          file_pattern: 'CHANGELOG.md docs/*.md'
