name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 💡 Added caching so your game dependencies don't re-download every single time
          cache: 'pip'

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pygame,test]"

      - name: Run Headless Pygame Tests
        # 💡 Calls your custom script instead of raw pytest
        run: ./.github/scripts/run-headless.sh

      - name: Profile Suite Performance
        if: always() # Runs even if your tests fail so you get metrics
        uses: ./.github/actions/analyze-tests
