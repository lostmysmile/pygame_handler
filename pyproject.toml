[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-handler"
version = "0.1.1"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ordered-set"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
pygame = ["pygame"]
pygame-ce = ["pygame-ce"]
test = ["pytest"]
