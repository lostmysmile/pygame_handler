[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-handler"
version = "0.1.1"
requires-python = ">=3.15"
description = "A system that helps build pygame game loops like a game engine"
license = "MIT"
readme = "README.md" 
dependencies = [
    "ordered-set",
    "python-dotenv"
]

[project.urls]
Homepage = "https://github.com/lostmysmile/pygame_handler"

authors = [
    { name = "lostmysmile" }
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
pygame = ["pygame"]
pygame-ce = ["pygame-ce"]
test = ["pytest"]
